name: Build and release ZZMMI.app

on:
  schedule:
    # 11:00 UTC = 6:00 AM EST (7:00 AM during daylight saving time; cron is always UTC).
    - cron: "0 11 * * *"
  workflow_dispatch: # manual runs always build

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.commits.outputs.build }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Skip if HEAD has already been released, rather than looking for commits in a calendar
      # window: GitHub often starts scheduled runs hours late, so a "yesterday" window can
      # contain a commit that an earlier (manual or scheduled) run already released.
      - id: commits
        name: Check whether HEAD was already released
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run: building regardless of commit activity."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          released=$(git tag --points-at HEAD --list "build-*")
          if [ -n "$released" ]; then
            echo "HEAD ($(git rev-parse --short HEAD)) already released as: $released"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "HEAD ($(git rev-parse --short HEAD)) has no release yet: building."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-latest # Apple Silicon; tracks GitHub's current image so it doesn't get retired
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build Windows helpers
        run: |
          brew install mingw-w64
          make -C bridge keys

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" py2app

      - name: Test
        run: python -m pytest -q

      # Picked before building: macos/setup.py stamps ZZMMI_BUILD_TAG into Info.plist, and the
      # app's "Check for updates" compares it with the latest release's tag.
      - name: Pick release tag
        run: |
          echo "ZZMMI_BUILD_DAY=$(TZ=America/New_York date +%Y-%m-%d)" >> "$GITHUB_ENV"
          echo "ZZMMI_BUILD_TAG=build-$(TZ=America/New_York date +%Y%m%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Build app
        run: PYTHON=python macos/build.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          day="$ZZMMI_BUILD_DAY"
          tag="$ZZMMI_BUILD_TAG"
          prev=$(git tag --list "build-*" --sort=-creatordate | head -n 1)
          {
            echo "Automated build of \`$(git rev-parse --short HEAD)\`."
            echo
            echo "Download **ZZMMI.zip**, unzip it and move ZZMMI.app to Applications."
            echo "The app is not notarized: on first launch, right-click it and choose Open"
            echo "(or allow it in System Settings → Privacy & Security)."
            echo
            echo "## Changes"
            if [ -n "$prev" ]; then
              git log "$prev..HEAD" --format="- %s (%h)"
            else
              git log --format="- %s (%h)"
            fi
          } > notes.md
          gh release create "$tag" macos/dist/ZZMMI.zip \
            --target "$GITHUB_SHA" \
            --title "ZZMMI $day" \
            --notes-file notes.md
